#:schema https://mise.jdx.dev/schema/mise.json

[env]
# hk: gives steps their directory's mise env.
# Install hooks via `just install-hooks`.
HK_MISE = "1"

# react-doctor: telemetry stops only via this
# or --no-telemetry, not noScore.
# Remove if the project does not use react-doctor.
REACT_DOCTOR_NO_TELEMETRY = "1"

[tools]
age = "1.3.2"
fnox = "1.35.3"
gitleaks = "8.30.1"
hk = "2.0.1"
just = "1.58.0"
node = "24.21.0"
op = "2.39.0"
pnpm = "12.6.0"
